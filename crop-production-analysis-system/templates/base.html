<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Crop Production Analysis{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">🌱 Crop Analysis</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('upload') }}">Upload CSV</a>
      <a class="nav-link" href="{{ url_for('reports') }}">Reports</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="text-center text-muted py-4">Historical analysis only — patterns do not prove causation.</footer>
</body>
</html>
